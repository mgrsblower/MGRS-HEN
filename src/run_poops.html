<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="MGRS-HEN Poops chain execution console for supported PS4 firmware.">
<title>MGRS-HEN | Poops chain</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="crt-texture" aria-hidden="true"></div>
<main class="retro-terminal">
  <header id="brand" class="retro-header">
    <div class="traffic-lights" aria-hidden="true">
      <span class="dot dot-close"></span>
      <span class="dot dot-min"></span>
      <span class="dot dot-max"></span>
    </div>
    <div class="retro-title">MGRS-HEN // POOPS CHAIN</div>
  </header>
  <div id="wrap" class="retro-screen chain-screen">
    <div class="status-block" aria-label="Poops status">
      <div class="status-label">STATUS //</div>
      <div id="state">loading poops chain...</div>
    </div>
    <section class="log-shell" aria-label="Poops chain output">
      <div class="log-header">
        <span>STDOUT // LIVE STREAM</span>
        <span>FW 12.50 - 13.00</span>
      </div>
      <div id="out"></div>
    </section>
  </div>
  <footer class="retro-footer">
    <span>MGRS-HEN Kernel Exploit Loader // Self-Hosted Offline Suite</span>
    <span class="footer-jewel" aria-hidden="true"></span>
  </footer>
</main>
<script type="module">import "./chain_poops.js";</script>
</body>
</html>
