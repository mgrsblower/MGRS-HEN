<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="MGRS-HEN Lapse chain execution console for supported PS4 firmware.">
<title>MGRS-HEN | Lapse chain</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<canvas id="matrix-canvas"></canvas>
<div class="crt-texture" aria-hidden="true"></div>
<main class="retro-terminal">
  <header id="brand" class="retro-header">
    <div class="traffic-lights" aria-hidden="true">
      <span class="dot dot-close"></span>
      <span class="dot dot-min"></span>
      <span class="dot dot-max"></span>
    </div>
    <div class="retro-title">MGRS-HEN // LAPSE CHAIN</div>
  </header>
  <div id="wrap" class="retro-screen chain-screen">
    <div class="status-block" aria-label="Lapse status">
      <div class="status-label">STATUS //</div>
      <div id="state">loading lapse chain...</div>
    </div>
    <section class="log-shell" aria-label="Lapse chain output">
      <div class="log-header">
        <span>STDOUT // LIVE STREAM</span>
        <span>FW 11.00 - 12.02</span>
      </div>
      <div id="out"></div>
    </section>
  </div>
  <footer class="retro-footer">
    <span>MGRS-HEN Kernel Exploit Loader // Self-Hosted Offline Suite</span>
    <span class="footer-jewel" aria-hidden="true"></span>
  </footer>
</main>
<script>
(function() {
  var c = document.getElementById("matrix-canvas");
  if (!c) return;
  var ctx = c.getContext("2d");
  var w, h, cols, drops;
  var chars = "0123456789ABCDEF+=-:.*#@+WXZabcdefghijklmnopqrstuvwxyz";
  function init() {
    w = c.width = window.innerWidth;
    h = c.height = window.innerHeight;
    cols = Math.floor(w / 14);
    drops = Array(cols).fill(1);
  }
  function draw() {
    ctx.fillStyle = "rgba(17, 20, 23, 0.08)";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#00ff66";
    ctx.font = '12px "JetBrains Mono", monospace';
    for (var i = 0; i < drops.length; i++) {
      var text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(text, i * 14, drops[i] * 14);
      if (drops[i] * 14 > h && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }
  window.addEventListener("resize", init);
  init();
  setInterval(draw, 35);
})();
</script>
<script type="module">import "./chain_lapse.js";</script>
</body>
</html>
